plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    // Zeta: Modrinth's maven by version id (see gradle.properties).
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Zeta: compile-time only, to target the real ForgeEventsRemapper class our mixin patches.
    // Resolved from Modrinth's maven (the exact jar that is deployed, by version id) - no bundling,
    // the mixin's own "required" dependency entry in mods.toml already hard-requires zeta to be installed.
    compileOnly("maven.modrinth:zeta:${zeta_modrinth_version}") { transitive = false }

    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            zeta_version           : zeta_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Release notes of this version: its own section of CHANGELOG.md, from "## [<mod_version>]" up to the next
// "## [" heading. A release without one fails instead of going out with empty or wrong notes.
def changelogSection = providers.provider {
    def lines = file('CHANGELOG.md').readLines('UTF-8')
    int start = lines.findIndexOf { it.trim() == "## [${mod_version}]" }
    if (start < 0) {
        throw new GradleException("CHANGELOG.md has no '## [${mod_version}]' section - add one before releasing")
    }
    int end = lines.findIndexOf(start + 1) { it.startsWith('## [') }
    def body = lines.subList(start + 1, end < 0 ? lines.size() : end).join('\n').trim()
    if (body.isEmpty()) {
        throw new GradleException("The '## [${mod_version}]' section of CHANGELOG.md is empty")
    }
    "## [${mod_version}]\n\n${body}"
}

// GitHub release only - this mod is deliberately not on CurseForge (a narrow client-side tweak for one pack).
// Run by .github/workflows/release.yml on a version tag. Without GITHUB_TOKEN (e.g. on a dev machine) it's
// always a dry run: the release is only written to build/publishMods.
publishMods {
    file = jar.archiveFile
    changelog = changelogSection
    version = mod_version
    type = STABLE
    displayName = "${mod_id}-${mod_version}"
    modLoaders.add('neoforge')
    dryRun = providers.environmentVariable('GITHUB_TOKEN').getOrNull() == null

    github {
        accessToken = providers.environmentVariable('GITHUB_TOKEN')
        repository = project.github_repository
        commitish = providers.environmentVariable('GITHUB_SHA').orElse('main')
        tagName = "v${mod_version}"
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
