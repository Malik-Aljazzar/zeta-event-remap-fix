## Mod Properties

mod_id=zeta_event_remap_fix
mod_name=Zeta Forge Event Remap Perf Fix
# No upstream license applies (this is new, standalone code, not a fork) - MIT.
mod_license=MIT
mod_version=1.0.0
mod_group_id=dev.malik.zetaeventremapfix

# Zeta: version actually deployed (mods folder). Client-only - we only target the client's FPS
# symptom here, not server TPS (unreported). ForgeEventsRemapper.lambda$findForgeWrapper$4 calls
# Constructor.newInstance(...) on EVERY event fire to build a Forge-style wrapper object; the
# Constructor lookup itself is already cached (one-time, at mod-init registration via
# findForgeWrapper/zetaToForgeMap) - confirmed via javap against the real deployed jar, not
# guessed - so this is not a missing-cache bug like the ScorchedGuns one. The only remaining lever
# is replacing classic Constructor.newInstance reflection with a cached java.lang.invoke.MethodHandle
# for the same constructor, which avoids some of Constructor.newInstance's own per-call overhead
# (access check, InvocationTargetException wrapping). Expected gain is modest, not dramatic -
# built on explicit user request after flagging this.
zeta_version=1.1-40

# Compile-time dependency coordinates (never shipped - see build.gradle):
# Zeta 1.1-40 (NeoForge 1.21.1) from Modrinth's maven, by version id.
zeta_modrinth_version=9GjNW2Gf

